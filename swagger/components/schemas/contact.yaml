type: object
required:
  - name
  - contactType
  - userId
  - createdAt
  - updatedAt
properties:
  _id:
    type: string
    description: Contact id
    example: 67f2ac630248dda60bc9df22
  name:
    type: string
    description: Contact name
    example: "John Doe"
  phoneNumber:
    type: integer
    description: Phone number of contact
    example: 06666666666
  isFavourite: 
    type: boolean
    description: Favorite or not
    example: true| false
  contactType: 
    type: string
    description: type of contact
    example: work| home| personal
  userId:
    type: object
    description: ID of the user who owns the contact
    example: 67f2b37d070930bb1b7df45c
  createdAt:
    type: string
    format: date-time
    description: Creation timestamp
    example: 2024-04-07T12:34:56.789Z
  updatedAt:
    type: string
    format: date-time
    description: Last update timestamp
    example: 2024-04-07T12:34:56.789Z
