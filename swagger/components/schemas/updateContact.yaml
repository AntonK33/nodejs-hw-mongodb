type: object
properties:
  _id:
    type: string
    description: Contact ID
    example: 67f2ac630248dda60bc9df22

  name:
    type: string
    description: Contact name
    example: "John Doe"

  phoneNumber:
    type: integer
    description: Phone number of contact
    example: 06666666666

  isFavourite:
    type: boolean
    description: Favorite or not
    example: false

  contactType:
    type: string
    description: Type of contact
    enum: [work, home, personal]
    example: work

  userId:
    type: string
    description: ID of the user who owns the contact
    example: 67f2b37d070930bb1b7df45c
