tags:
  - Contacts
summary: Create contact
operationId: addContact
description: 'Create a contact with payload'
security:
  - bearerAuth: []
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
          - contactType    
        properties:
          name:
            description: "Contact's name"
            type: string
            example: 'John Doe'
          email:
            type: string
            description: Contact email
            example: "antonkulackov@gmail.com"
          photo:
            type: string
            format: binary
            description: Contact photo
            example: null
          phoneNumber:
            type: integer
            description: Phone number of contact
            example: 06666666666
          isFavourite: 
            type: boolean
            description: Favorite or not
            example: false
          contactType: 
            type: string
            description: type of contact
            example: home
responses:
  '201':
    description: Creates a student
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Successfully created a student!            
            data:               
              $ref: '../../components/schemas/contact.yaml'
              
  '400':
    $ref: ../../components/responses/400.yaml
  