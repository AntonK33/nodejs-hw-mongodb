tags:
  - Contacts
summary: Create contact
operationId: addContact
description: 'Create a contact with payload'
security:
  - bearerAuth: []
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - userId
          - contactType    
        properties:
          name:
            description: "Contact's name"
            type: string
            example: 'John Doe'
          userId:
            description: "Contact's parent id"
            type: string
            example: 65e4decdd286b30065d54af9
          photo:
            description: "Student's photo"
            type: string        
          phoneNumber:
            type: integer
            description: Phone number of contact
            example: 06666666666
          isFavourite: 
            type: boolean
            description: Favorite or not
            example: true| false
          contactType: 
            type: string
            description: type of contact
            example: work| home| personal
          avatar:
            type: string
            description: Contact avatar URL or path
            example: null
responses:
  '201':
    description: Creates a student
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Successfully created a student!
            data:
              type: object
              $ref: ../../components/schemas/contact.yaml
  '401':
    $ref: ../../components/responses/401.yaml
  '500':
    $ref: ../../components/responses/500.yaml
