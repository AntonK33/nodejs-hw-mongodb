tags:
  - Contacts
summary: Get list of contacts
operationId: getContactsController
description: Get list of contacts with this endpoint
security:
  - bearerAuth: []
parameters:
  - in: query
    name: page
    required: false
    schema:
      type: integer
    example: 1

  - in: query
    name: perPage
    required: false
    schema:
      type: integer
    example: 10

  - in: query
    name: sortBy
    required: false
    schema:
      type: string
    example: age
    description: All contact fields can be used. Default is _id.

  - in: query
    name: sortOrder
    required: false
    schema:
      type: string
      enum: [asc, desc]
    example: asc

  - in: query
    name: name
    required: false
    schema:
      type: string
    description: Contact name
    example: John Doe

  - in: query
    name: phoneNumber
    required: false
    schema:
      type: integer
    description: Phone number of contact
    example: 06666666666

  - in: query
    name: isFavourite
    required: false
    schema:
      type: boolean
    description: Whether contact is marked as favourite
    example: false

  - in: query
    name: contactType
    required: false
    schema:
      type: string
    description: Type of contact
    example: work

  - in: query
    name: userId
    required: false
    schema:
      type: string
    description: ID of the user who owns the contact
    example: 67f2b37d070930bb1b7df45c

  - in: query
    name: photo
    required: false
    schema:
      type: string
      format: binary
    description: Contact photo
    example: null

responses:
  '200':
    description: Successfully found contacts!
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully found contacts!
            data:
              type: object
              required:
                - data
                - page
                - perPage
                - totalItems
                - totalPages
                - hasNextPage
                - hasPreviousPage
              properties:
                data:
                  type: array
                  items:
                    $ref: '../../components/schemas/contact.yaml'
                page:
                  type: number
                  example: 2
                perPage:
                  type: number
                  example: 4
                totalItems:
                  type: number
                  example: 4
                totalPages:
                  type: number
                  example: 4
                hasNextPage:
                  type: boolean
                  example: false
                hasPreviousPage:
                  type: boolean
                  example: true

  '401':
    $ref: ../../components/responses/401.yaml
