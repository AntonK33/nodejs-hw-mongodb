tags:
  - Contacts
summary: Update contact
operationId: updateContact
description: Update existing contact by ID
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    schema:
      type: string
    description: ID of the contact to update
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            type: string
            description: "Contact's name"
            example: 'John Doe'
          email:
            type: string
            description: Contact email
            example: 'antonkulackov@gmail.com'
          photo:
            type: string
            format: binary
            description: Contact photo
            example: null
          phoneNumber:
            type: integer
            description: Phone number of contact
            example: 06666666666
          isFavourite:
            type: boolean
            description: Favorite or not
            example: true
          contactType:
            type: string
            description: type of contact
            enum: ['work', 'home', 'personal']
            example: home
responses:
  '200':
    description: Successfully updated contact
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Contact updated successfully
            data:
              type: object
              $ref: '../../../components/schemas/contact.yaml'
  '400':
    $ref: '../../../components/responses/400.yaml'
  '401':
    $ref: '../../../components/responses/401.yaml'
  '404':
    $ref: '../../../components/responses/404.yaml'
  '500':
    $ref: '../../../components/responses/500.yaml'
